# OmniPost 容器内进程守护配置
# 启动方式（详见 deploy/README.md）：
#   /opt/data/omnipost/backend/.venv/bin/supervisord -c /opt/data/omnipost/deploy/supervisord.conf

[unix_http_server]
file=/opt/data/omnipost/deploy/supervisor.sock
chmod=0700

[supervisord]
logfile=/opt/data/omnipost/deploy/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/opt/data/omnipost/deploy/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/data/omnipost/deploy/supervisor.sock

[program:omnipost-backend]
command=/opt/data/omnipost/backend/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --log-level warning
directory=/opt/data/omnipost/backend
autostart=true
autorestart=true
startretries=5
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/opt/data/omnipost/deploy/logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/opt/data/omnipost/deploy/logs/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
